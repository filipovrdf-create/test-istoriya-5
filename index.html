<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Тест по истории ❤️</title>
<style>
:root{
  --bg:#fff7fb; --card:#ffffff; --ink:#2d2340; --muted:#7a6f8c;
  --accent:#e0457b; --accent2:#8b5cf6; --ok:#16a34a; --okbg:#dcfce7;
  --bad:#dc2626; --badbg:#fee2e2; --line:#f1dbe7; --chip:#fdeef5;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#1b1524; --card:#261d33; --ink:#f3ecff; --muted:#b4a8c7;
    --accent:#ff6fa0; --accent2:#a78bfa; --ok:#4ade80; --okbg:#173d27;
    --bad:#f87171; --badbg:#47191c; --line:#3a2d4c; --chip:#33243f;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:17px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 40px}
.card{background:var(--card);border-radius:20px;padding:20px;box-shadow:0 4px 20px rgba(224,69,123,.10);margin-bottom:14px;border:1px solid var(--line)}
h1{font-size:24px;margin:4px 0 8px;line-height:1.25}
h2{font-size:19px;margin:0 0 10px}
.hero{text-align:center;padding:26px 18px}
.heart{font-size:56px;animation:beat 1.4s infinite}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.18)}30%{transform:scale(1)}45%{transform:scale(1.12)}}
.love{font-size:20px;font-weight:700;color:var(--accent);margin:10px 0 4px}
.love2{font-size:18px;margin:0 0 6px}
.sub{color:var(--muted);font-size:15px;margin:6px 0 0}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:15px 16px;font-size:17px;font-weight:700;cursor:pointer;margin-top:10px;text-align:left;color:var(--ink);background:var(--chip)}
.btn.main{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;text-align:center}
.btn.ghost{background:transparent;border:2px solid var(--line);text-align:center}
.btn small{display:block;font-weight:400;color:var(--muted);font-size:14px;margin-top:2px}
.btn.main small{color:#ffe4ef}
.grid{display:grid;grid-template-columns:1fr;gap:0}
.best{float:right;font-size:13px;font-weight:600;color:var(--accent)}
.top{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--muted);margin-bottom:8px}
.bar{height:8px;background:var(--line);border-radius:8px;overflow:hidden;margin-bottom:14px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .3s}
.tag{display:inline-block;background:var(--chip);color:var(--accent);font-size:13px;font-weight:700;border-radius:999px;padding:3px 10px;margin-bottom:10px}
.q{font-size:19px;font-weight:700;margin:0 0 14px}
.opt{display:block;width:100%;text-align:left;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:13px 14px;font-size:17px;margin:0 0 10px;cursor:pointer}
.opt b{color:var(--accent2);margin-right:6px}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.bad{border-color:var(--bad);background:var(--badbg)}
.opt:disabled{cursor:default}
.ex{border-radius:14px;padding:12px 14px;margin-top:4px;font-size:16px}
.ex.ok{background:var(--okbg)} .ex.bad{background:var(--badbg)}
.ex .h{font-weight:800;margin-bottom:4px}
.score{font-size:54px;font-weight:800;text-align:center;margin:6px 0 0;color:var(--accent)}
.stars{font-size:38px;text-align:center;letter-spacing:4px}
.mark{text-align:center;font-size:18px;font-weight:700;margin:6px 0}
.list{margin:0;padding:0;list-style:none}
.list li{border-top:1px solid var(--line);padding:10px 0;font-size:15px}
.list li .y{color:var(--bad)} .list li .r{color:var(--ok);font-weight:700}
.para{font-size:15px;display:flex;justify-content:space-between;border-top:1px solid var(--line);padding:7px 0}
.hidden{display:none}
.foot{text-align:center;color:var(--muted);font-size:13px;margin-top:18px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
/* Вопросы составлены по учебнику «История Древнего мира. 5 класс»
   (Кошелев В.С. и др., Народная асвета) — §1–§8, раздел
   «Первобытное общество на пути к цивилизации».
   В каждом вопросе первый ответ — правильный (при показе варианты перемешиваются). */
const PARAS = {
  1:"§1. Что изучает история",
  2:"§2. Счёт лет в истории",
  3:"§3. Древнейшие люди",
  4:"§4. Человек разумный. Родовая община",
  5:"§5. Искусство и религия первобытных людей",
  6:"§6. Земледелие и животноводство",
  7:"§7. Металлы, ремесло, торговля",
  8:"§8. На пути к цивилизации"
};
const Q = [
// §1
{p:1,q:"Слово «история» пришло из греческого языка. Что оно означает?",a:["Рассказ о прошедших событиях, исследование","Наука о звёздах и планетах","Свод законов древнего царя","Песня о богах"],e:"«История» — рассказ, исследование о прошедшем. Точнее: наука о жизни людей в прошлом."},
{p:1,q:"Как называется самый древний период истории человечества?",a:["Первобытность","Средние века","Новое время","Наша эра"],e:"Первобытность длилась многие тысячи лет — от появления предков человека до появления городов, государства и письменности."},
{p:1,q:"Мифы, легенды и предания — это какие исторические источники?",a:["Устные","Вещественные","Письменные","Изобразительные"],e:"Они передавались «из уст в уста», поэтому их называют устными."},
{p:1,q:"Орудия труда, посуда, монеты, остатки жилищ — это источники…",a:["вещественные","устные","письменные","сказочные"],e:"Это вещи, которые люди сделали или использовали, — вещественные источники."},
{p:1,q:"Книги, надписи, законы — это источники…",a:["письменные","вещественные","устные","природные"],e:"Всё, что записано, — письменные источники."},
{p:1,q:"Какая наука изучает жизнь людей по вещественным источникам (по раскопкам)?",a:["Археология","Астрономия","География","Биология"],e:"Археологи проводят раскопки и изучают найденные вещи."},
{p:1,q:"Как звали музу истории в древнегреческих мифах?",a:["Клио","Афина","Гера","Медуза"],e:"Клио — покровительница истории."},
// §2
{p:2,q:"Почему людям понадобилось считать время (годы)?",a:["Земледельцам нужно было знать, когда сеять и собирать урожай","Чтобы праздновать дни рождения","Чтобы платить зарплату","Чтобы знать расписание уроков"],e:"Летосчисление появилось из практической нужды — прежде всего из-за земледелия."},
{p:2,q:"От какого события вели счёт лет римляне?",a:["От основания города Рима (753 г. до н. э.)","От рождения первого фараона","От постройки пирамид","От начала нашей эры"],e:"Легендарное основание Рима — 753 год до н. э."},
{p:2,q:"Как считали годы в Древнем Египте?",a:["От начала правления нового фараона","От основания Рима","От рождения Христа","От первого урожая пшеницы"],e:"При каждом новом фараоне счёт лет начинался заново."},
{p:2,q:"Сколько лет в одном веке?",a:["100","10","1000","50"],e:"Век (столетие) = 100 лет."},
{p:2,q:"Сколько веков в одном тысячелетии?",a:["10","100","5","12"],e:"Тысячелетие = 1000 лет = 10 веков."},
{p:2,q:"Что было раньше?",a:["300 год до н. э.","100 год до н. э.","Они были одновременно","100 год н. э."],e:"До нашей эры: чем БОЛЬШЕ число, тем РАНЬШЕ. 300 до н. э. раньше, чем 100 до н. э."},
{p:2,q:"От какого события в Европе ведут счёт «нашей эры»?",a:["От рождения Иисуса Христа","От основания Рима","От появления первых людей","От изобретения письменности"],e:"Наша эра (н. э.) — от предполагаемой даты рождения Иисуса Христа."},
{p:2,q:"Слово «хронология» в переводе с греческого означает…",a:["наука о времени","наука о земле","рассказ о войнах","счёт денег"],e:"Хронология — последовательность событий во времени, «наука о времени»."},
{p:2,q:"Какие годы составляют I век до н. э.?",a:["С 100 по 1 год до н. э.","С 1 по 100 год до н. э.","С 1 по 100 год н. э.","С 0 по 99 год до н. э."],e:"I век до н. э. начался в 100 г. до н. э. и закончился в 1 г. до н. э. (года «0» нет!)."},
{p:2,q:"Рим основан в 753 году до н. э. Какой это век?",a:["VIII век до н. э.","VII век до н. э.","VIII век н. э.","VII век н. э."],e:"753 входит в промежуток 800–701 до н. э. — это VIII век до н. э."},
{p:2,q:"Где на ленте времени находятся годы до нашей эры?",a:["Слева от черты","Справа от черты","Сверху","Их нет на ленте"],e:"Слева — до н. э., справа — н. э."},
// §3
{p:3,q:"Где, по мнению учёных, жили далёкие предки человека более 3 млн лет назад?",a:["В Восточной Африке","В Европе","В Австралии","В Америке"],e:"Человекообразные обезьяны — предки человека — жили в Восточной Африке."},
{p:3,q:"Рядом с костями «человека умелого» археологи находят…",a:["обколотые камни — первые орудия труда","железные мечи","глиняные горшки","бронзовые украшения"],e:"Человек умелый (более 2 млн лет назад) делал первые простейшие каменные орудия."},
{p:3,q:"Что дало прямохождение «человеку прямоходящему»?",a:["Освободились руки — они стали ловкими для работы","Он стал быстрее плавать","Он научился летать","Он перестал нуждаться в пище"],e:"Ходьба на двух ногах освободила руки, а руки помогали делать орудия."},
{p:3,q:"Собирательство и охота — это какое хозяйство?",a:["Присваивающее","Производящее","Торговое","Ремесленное"],e:"Присваивающее: человек берёт готовое у природы, сам пищу ещё не производит."},
{p:3,q:"Как учёные называют группы древнейших людей по 15–20 человек?",a:["Первобытное человеческое стадо","Родовая община","Племя","Государство"],e:"Первобытное человеческое стадо — самая ранняя форма жизни людей."},
{p:3,q:"Почему неандертальцы так называются?",a:["По долине Неандерталь в Германии, где нашли их останки","По имени учёного Неандера-Таля","Это значит «человек огня»","По названию пещеры во Франции"],e:"Долина Неандерталь в Германии. (А пещера во Франции — это Кро-Маньон, §4!)"},
{p:3,q:"Что из этого НЕ давал древним людям огонь?",a:["Электричество","Тепло","Защиту от хищников","Возможность готовить пищу"],e:"Огонь грел, светил, защищал и позволял готовить еду."},
{p:3,q:"Сколько длился каменный век?",a:["Более 2 миллионов лет","Около 100 лет","Около 1000 лет","10 тысяч лет"],e:"Каменный век длился более 2 млн лет."},
{p:3,q:"Что из этого — одно из главных отличий человека от животных?",a:["Умение изготавливать орудия труда","Умение бегать","Умение охотиться","Умение жить группой"],e:"Именно изготовление орудий (а ещё огонь и речь) выделило человека из мира животных."},
// §4
{p:4,q:"Что случилось около 100 тыс. лет назад на севере Европы, Азии и Америки?",a:["Всё покрылось ледником","Началась жара и пустыни","Появились первые города","Начался железный век"],e:"Огромный ледник. Человек выжил благодаря огню, одежде и жилищам."},
{p:4,q:"Когда в Европе появился человек разумный?",a:["Более 40 тыс. лет назад","Более 3 млн лет назад","Около 2 тыс. лет назад","Около 300 лет назад"],e:"Более 40 тыс. лет назад."},
{p:4,q:"Почему человека разумного называют кроманьонцем?",a:["По пещере Кро-Маньон во Франции","По долине в Германии","По имени вождя племени","По названию реки в Африке"],e:"Останки впервые нашли в пещере Кро-Маньон во Франции."},
{p:4,q:"Родиной человека разумного считается…",a:["Африка","Европа","Америка","Австралия"],e:"Родина — Африка. Все современные люди — потомки кроманьонцев."},
{p:4,q:"Для чего кроманьонцы использовали шилья?",a:["Чтобы шить одежду из шкур","Чтобы ловить рыбу","Чтобы рыть землю","Чтобы добывать огонь"],e:"Шилья — для шитья одежды. Крючки и гарпуны — для рыбы."},
{p:4,q:"Как проходила загонная охота?",a:["С помощью огня зверей гнали в ямы-ловушки, болото или овраг","Охотились с ружьями","Ловили зверей сетями с лодок","Охотились по одному из засады"],e:"Охотились вместе, огнём загоняли крупных зверей в ловушки."},
{p:4,q:"Кто входил в родовую общину?",a:["Родственники, потомки общего предка","Случайные соседи","Только мужчины-охотники","Жители разных стран"],e:"Род — коллектив родственников с общим предком, общим жилищем и запасами."},
{p:4,q:"Кто управлял родовой общиной?",a:["Старейшина — опытный и уважаемый сородич","Царь","Фараон","Купец"],e:"Старейшина следил за справедливым распределением еды, одежды, мест в жилище."},
// §5
{p:5,q:"Каким временем датируются самые древние произведения изобразительного искусства?",a:["40-м тысячелетием до н. э.","1-м веком н. э.","3 млн лет назад","Железным веком"],e:"Около 40-го тысячелетия до н. э."},
{p:5,q:"Кого чаще всего рисовали первобытные художники?",a:["Животных, на которых охотились","Цветы и деревья","Царей и воинов","Корабли"],e:"Животные — главная добыча, поэтому их рисовали чаще всего."},
{p:5,q:"Чем рисовали на стенах пещер?",a:["Древесным углём и природными красками","Масляными красками","Карандашами","Чернилами на бумаге"],e:"Уголь и краски из природных веществ: белая, чёрная, красная."},
{p:5,q:"Что такое орнамент?",a:["Узор, которым украшали посуду и изделия из кости","Фигурка животного","Рисунок охоты на стене","Название пещеры"],e:"Орнамент — узор на изделиях из кости, каменной и глиняной посуде."},
{p:5,q:"С чем связывают маленькие женские статуэтки каменного века?",a:["С поклонением богине-матери","С игрушками для детей","С торговлей","С календарём"],e:"Скорее всего, это образ богини-матери."},
{p:5,q:"Как называется вера во многих богов?",a:["Многобожие (язычество)","Единобожие","Археология","Хронология"],e:"Многобожие, или язычество."},
{p:5,q:"Что такое идол?",a:["Фигурка бога из кости, дерева или камня, которой поклонялись","Рисунок мамонта","Вождь племени","Орудие для охоты"],e:"Идол — изображение бога, которому поклонялись."},
{p:5,q:"Почему в древних могилах находят посуду, украшения и оружие?",a:["Люди верили в жизнь после смерти","Их случайно потеряли","Так прятали клад","Так наказывали воров"],e:"Верили, что вещи понадобятся умершему в ином мире."},
{p:5,q:"Почему у древних людей появилась вера в духов?",a:["Они не могли объяснить гром, молнию, наводнения","Им так велел царь","Это придумали учёные","Духов нарисовали на стенах"],e:"Непонятные и грозные явления природы объясняли действием духов."},
// §6
{p:6,q:"Когда ледник начал таять и отступать на север?",a:["Около 12 тыс. лет назад","Около 3 млн лет назад","Около 100 лет назад","Около 40 тыс. лет назад"],e:"Около 12 тыс. лет назад — началось потепление."},
{p:6,q:"Какое изобретение позволило охотиться на быстрых животных издалека?",a:["Лук и стрелы","Ручное рубило","Палка-копалка","Гончарный круг"],e:"Лук и стрелы — поражать дичь на расстоянии."},
{p:6,q:"Какие растения — самые древние сельскохозяйственные культуры?",a:["Пшеница, просо, ячмень","Картофель, кукуруза, томаты","Рис, чай, хлопок","Яблоки, груши, вишни"],e:"Пшеница, просо и ячмень."},
{p:6,q:"Чем древние земледельцы срезали колосья?",a:["Каменными серпами","Железными косами","Бронзовыми мечами","Руками без орудий"],e:"Каменный серп. Землю рыхлили мотыгой, зерно растирали на зернотёрке."},
{p:6,q:"Какое животное человек приручил первым?",a:["Собаку","Корову","Лошадь","Кошку"],e:"Первой была собака."},
{p:6,q:"Земледелие и животноводство — это какое хозяйство?",a:["Производящее","Присваивающее","Охотничье","Собирательское"],e:"Человек сам производит пищу — производящее хозяйство."},
{p:6,q:"Почему земледелие привело к оседлому образу жизни?",a:["Нужно было жить рядом с полем и ждать урожая","Люди устали ходить","Так приказал вождь","Исчезли все реки"],e:"Чтобы вырастить урожай, надо оставаться на месте."},
{p:6,q:"Что такое ремесло?",a:["Изготовление изделий ручным способом","Охота на мамонтов","Сбор ягод и грибов","Торговля на рынке"],e:"Ремесло: посуда, ткани, орудия — сделанные руками."},
{p:6,q:"Что такое племя?",a:["Несколько общин из одной местности с общим языком и обычаями","Одна семья","Группа из 15–20 древнейших людей","Государство с царём"],e:"Племенем управлял совет старейшин."},
{p:6,q:"Где появились первые земледелие и животноводство (10–12 тыс. лет назад)?",a:["В Передней Азии","В Северной Европе","В Австралии","В Антарктиде"],e:"В Передней Азии."},
// §7
{p:7,q:"Где и когда появилась обработка металлов?",a:["В Передней Азии около 9 тыс. лет назад","В Европе 100 лет назад","В Африке 3 млн лет назад","В Америке 40 тыс. лет назад"],e:"Около 9 тыс. лет назад в Передней Азии."},
{p:7,q:"Какие металлы человек научился плавить первыми?",a:["Медь и олово","Железо и сталь","Алюминий","Золото и платину"],e:"Медь и олово — их можно расплавить даже в костре."},
{p:7,q:"Что такое бронза?",a:["Сплав меди и олова","Чистое железо","Сплав золота и серебра","Обожжённая глина"],e:"Бронза = медь + олово. Она прочнее меди."},
{p:7,q:"Когда люди научились обрабатывать железо?",a:["В конце II — начале I тыс. до н. э.","Около 3 млн лет назад","В 20 веке","Около 40 тыс. лет назад"],e:"Конец II — начало I тысячелетия до н. э. Начался железный век."},
{p:7,q:"В каком порядке шли «века» по материалу орудий?",a:["Каменный → бронзовый → железный","Железный → бронзовый → каменный","Бронзовый → каменный → железный","Каменный → железный → бронзовый"],e:"Сначала камень, потом бронза, потом железо."},
{p:7,q:"Что изобрели для изготовления посуды?",a:["Гончарный круг","Ткацкий станок","Лук и стрелы","Зернотёрку"],e:"Гончарный круг — сосуды быстрее и аккуратнее."},
{p:7,q:"Что могло служить первыми деньгами?",a:["Раковины, скот, шкуры, зерно","Бумажные купюры","Банковские карты","Золотые слитки с печатью царя"],e:"Морские раковины, животные, шкуры, зерно."},
{p:7,q:"Чем соседская община отличалась от родовой?",a:["В ней жили семьи из разных родов, у каждой своё хозяйство","В ней жили только родственники","В ней не было земли","В ней правил фараон"],e:"Соседи — не родня. Своя земля у семьи, а пастбища, леса и водоёмы — общие."},
// §8
{p:8,q:"Что такое племенной союз?",a:["Объединение нескольких племён","Одна большая семья","Союз двух государств","Группа ремесленников"],e:"Племена объединялись для защиты земель, пастбищ и скота."},
{p:8,q:"Когда во главе племени становился вождь?",a:["Во время войны или бедствия","Только на праздниках","Когда умирал фараон","Каждый понедельник"],e:"Нужен был смелый и умелый воин-руководитель."},
{p:8,q:"Кто выбирал вождя?",a:["Собрание всех взрослых мужчин","Жрецы в храме","Соседнее племя","Один старейшина"],e:"Вождя избирали на собрании взрослых мужчин."},
{p:8,q:"Кто составлял родовую знать?",a:["Вожди и старейшины","Рабы","Ремесленники","Дети"],e:"Им отдавали лучшие земли, скот и одежду."},
{p:8,q:"Кем становились пленники, захваченные на войне?",a:["Рабами","Вождями","Старейшинами","Жрецами"],e:"Пленников превращали в рабов и заставляли работать."},
{p:8,q:"Что НЕ является признаком государства?",a:["Общий костёр рода","Границы","Правитель и законы","Армия и налоги"],e:"Признаки государства: границы, правитель, законы, армия, налоги."},
{p:8,q:"Где возникли первые государства?",a:["В долинах великих рек (Передняя Азия, Египет, Индия)","На вершинах гор","В лесах Европы","На островах в океане"],e:"В долинах великих рек — там нужен был общий труд и управление водой."},
{p:8,q:"Когда начался переход к цивилизации?",a:["На рубеже IV–III тыс. до н. э.","Около 3 млн лет назад","В I веке н. э.","Около 100 тыс. лет назад"],e:"Рубеж IV–III тысячелетий до н. э. — второй этап истории Древнего мира."},
{p:8,q:"Что из этого появилось ПОЗЖЕ всего?",a:["Государство","Производящее хозяйство","Соседская община","Племенной союз"],e:"Цепочка: хозяйство → соседская община → племенные союзы → знать → неравенство → государство."},
{p:8,q:"Что из этого — признак цивилизации?",a:["Города, торговля и деньги","Первобытное стадо","Ручное рубило","Жизнь в пещере"],e:"Цивилизация: государство, города, ремёсла, торговля, деньги."}
];

const STORE = "hist5_best_v1";
const app = document.getElementById("app");
let state = null;

function loadBest(){ try{ return JSON.parse(localStorage.getItem(STORE)) || {}; }catch(e){ return {}; } }
function saveBest(key, pct){ try{ const b=loadBest(); if(!b[key]||pct>b[key]){ b[key]=pct; localStorage.setItem(STORE, JSON.stringify(b)); } }catch(e){} }
function shuffle(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function home(){
  const best = loadBest();
  const b = k => best[k] ? `<span class="best">лучший: ${best[k]}%</span>` : "";
  let paras = "";
  for(const n in PARAS){
    const cnt = Q.filter(x=>x.p==n).length;
    paras += `<button class="btn" onclick="start('p${n}')">${b('p'+n)}${PARAS[n]}<small>${cnt} вопросов</small></button>`;
  }
  app.innerHTML = `
  <div class="card hero">
    <div class="heart">❤️</div>
    <div class="love">Для любимой дочки создано тестирование.</div>
    <div class="love2">Я тебя люблю, моя дочь 🌸</div>
    <h1>История Древнего мира · 5 класс</h1>
    <p class="sub">Раздел «Первобытное общество на пути к цивилизации», §1–§8</p>
  </div>
  <div class="card">
    <h2>🎯 Как в школе</h2>
    <button class="btn main" onclick="start('exam')">Контрольная: 20 вопросов вперемешку<small>из всех восьми параграфов</small></button>
    <button class="btn" onclick="start('all')">${b('all')}📚 Весь тест подряд — §1…§8<small>${Q.length} вопросов, с объяснениями</small></button>
  </div>
  <div class="card">
    <h2>📖 По одному параграфу</h2>
    <div class="grid">${paras}</div>
  </div>
  <div class="foot">После каждого ответа будет подсказка. В конце — работа над ошибками 💪</div>`;
  window.scrollTo(0,0);
}

function start(mode){
  let list;
  if(mode==="exam") list = shuffle(Q).slice(0,20);
  else if(mode==="all") list = Q.slice();
  else if(mode==="redo") list = shuffle(state.wrong.map(w=>w.item));
  else { const n = +mode.slice(1); list = shuffle(Q.filter(x=>x.p===n)); }
  state = { mode, list: list.map(item=>({item, opts: shuffle(item.a)})), i:0, right:0, wrong:[] };
  question();
}

function question(){
  const s = state, cur = s.list[s.i], total = s.list.length;
  const letters = ["А","Б","В","Г"];
  app.innerHTML = `
  <div class="card">
    <div class="top"><span>Вопрос ${s.i+1} из ${total}</span><span>✅ ${s.right}</span></div>
    <div class="bar"><i style="width:${(s.i/total)*100}%"></i></div>
    <span class="tag">${PARAS[cur.item.p]}</span>
    <p class="q">${esc(cur.item.q)}</p>
    <div id="opts">${cur.opts.map((o,k)=>`<button class="opt" data-k="${k}"><b>${letters[k]})</b>${esc(o)}</button>`).join("")}</div>
    <div id="after"></div>
  </div>
  <button class="btn ghost" onclick="if(confirm('Выйти в меню? Результат не сохранится.'))home()">← В меню</button>`;
  document.querySelectorAll(".opt").forEach(b=>b.addEventListener("click",()=>answer(+b.dataset.k)));
  window.scrollTo(0,0);
}

function answer(k){
  const s = state, cur = s.list[s.i];
  const correct = cur.item.a[0], chosen = cur.opts[k], ok = chosen===correct;
  if(ok) s.right++; else s.wrong.push({item:cur.item, chosen});
  document.querySelectorAll(".opt").forEach((b,idx)=>{
    b.disabled = true;
    if(cur.opts[idx]===correct) b.classList.add("ok");
    else if(idx===k) b.classList.add("bad");
  });
  const last = s.i===s.list.length-1;
  document.getElementById("after").innerHTML = `
    <div class="ex ${ok?'ok':'bad'}">
      <div class="h">${ok ? pick(["Верно! 🎉","Умница! ⭐","Правильно! 👏","Так держать! 💖"]) : "Не совсем 🙈 Правильно: «"+esc(correct)+"»"}</div>
      ${esc(cur.item.e)}
    </div>
    <button class="btn main" onclick="next()">${last?"Посмотреть результат 🏁":"Дальше →"}</button>`;
  document.getElementById("after").scrollIntoView({behavior:"smooth",block:"end"});
}
function pick(a){ return a[Math.floor(Math.random()*a.length)]; }

function next(){ state.i++; if(state.i<state.list.length) question(); else finish(); }

function finish(){
  const s = state, total = s.list.length, pct = Math.round(s.right/total*100);
  if(s.mode!=="redo") saveBest(s.mode, pct);
  // 10-балльная шкала, как в белорусской школе (ориентир)
  const ball = Math.max(1, Math.round(pct/10));
  const stars = pct>=90?"⭐⭐⭐":pct>=70?"⭐⭐":pct>=50?"⭐":"💪";
  const msg = pct>=90 ? "Великолепно! Ты настоящий историк! Папа тобой гордится ❤️"
            : pct>=70 ? "Очень хорошо! Чуть-чуть повторить — и будет идеально 💖"
            : pct>=50 ? "Неплохо! Давай разберём ошибки и попробуем ещё раз 🌸"
            : "Ничего страшного! Почитай параграфы и пройди ещё раз — получится! 🤗";
  // статистика по параграфам
  const byP = {};
  s.list.forEach(x=>{ byP[x.item.p] = byP[x.item.p]||{t:0,w:0}; byP[x.item.p].t++; });
  s.wrong.forEach(w=>{ byP[w.item.p].w++; });
  const paraRows = Object.keys(byP).length>1 ? Object.keys(byP).map(p=>{
      const r=byP[p], okn=r.t-r.w;
      return `<div class="para"><span>${PARAS[p]}</span><span>${r.w? "⚠️":"✅"} ${okn}/${r.t}</span></div>`;
    }).join("") : "";
  const mistakes = s.wrong.map(w=>`<li>${esc(w.item.q)}<br><span class="y">✗ ${esc(w.chosen)}</span><br><span class="r">✓ ${esc(w.item.a[0])}</span></li>`).join("");
  app.innerHTML = `
  <div class="card">
    <div class="stars">${stars}</div>
    <div class="score">${s.right} / ${total}</div>
    <div class="mark">${pct}% · примерно ${ball} из 10 баллов</div>
    <p style="text-align:center;margin:8px 0 0">${msg}</p>
  </div>
  ${paraRows?`<div class="card"><h2>📊 По параграфам</h2>${paraRows}</div>`:""}
  ${s.wrong.length?`<div class="card"><h2>📝 Работа над ошибками</h2><ul class="list">${mistakes}</ul>
    <button class="btn main" onclick="start('redo')">Перерешать только ошибки (${s.wrong.length})</button></div>`
    :`<div class="card" style="text-align:center"><h2>Ни одной ошибки! 🏆</h2></div>`}
  <button class="btn" onclick="start('${s.mode==='redo'?'exam':s.mode}')">🔁 Пройти ещё раз</button>
  <button class="btn ghost" onclick="home()">🏠 В меню</button>
  <div class="foot">Я тебя люблю, моя дочь ❤️</div>`;
  window.scrollTo(0,0);
}

home();
</script>
</body>
</html>
